<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZTAS | Đăng nhập hệ thống</title>
  <link rel="stylesheet" href="/assets/admin-login.css">
  <script defer src="/assets/admin-login.js"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand"><span>◆</span>PoC PTIT Security Console</div>
      <p class="eyebrow">TRUY CẬP HỆ THỐNG</p>
      <h1 id="login-title">Đăng nhập hệ thống</h1>

      <form id="admin-login-form">
        <label>Tên đăng nhập
          <input name="username" autocomplete="username" value="admin" required autofocus>
        </label>
        <label>Mật khẩu
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="message" id="login-message" role="alert"></p>
        <button type="submit">Đăng nhập</button>
      </form>
    </section>
  </main>
</body>
</html>
